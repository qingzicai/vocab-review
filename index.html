<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Between the Words · 词汇复习</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1a1814; --ink-2: #4a4740; --ink-3: #8a8780;
    --paper: #f7f4ee; --paper-2: #ede9e0; --paper-3: #e2ddd3;
    --accent: #b85c2a; --accent-2: #d4854f;
    --success: #3b6d11; --warn: #854f0b; --danger: #a32d2d;
    --serif: 'Libre Baskerville', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
  }
  body {
    font-family: var(--sans); background: var(--paper); color: var(--ink);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 2rem 1rem 6rem;
  }
  header { text-align: center; margin-bottom: 2rem; }
  .site-title { font-family: var(--serif); font-style: italic; font-size: clamp(1.4rem, 4vw, 2rem); color: var(--ink); }
  .site-sub { font-size: 0.75rem; color: var(--ink-3); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 4px; }

  #setup-screen { width: 100%; max-width: 480px; }
  .setup-card { background: white; border: 1px solid var(--paper-3); border-radius: 12px; padding: 2rem; text-align: center; }
  .setup-card h2 { font-family: var(--serif); font-size: 1.1rem; margin-bottom: 0.5rem; }
  .setup-card p { font-size: 0.85rem; color: var(--ink-2); line-height: 1.6; margin-top: 0.5rem; }

  #review-screen { display: none; width: 100%; max-width: 560px; }
  .progress-bar-wrap { height: 3px; background: var(--paper-3); border-radius: 99px; margin-bottom: 1.25rem; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s ease; }
  .session-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .session-label { font-size: 0.78rem; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; }
  .session-count { font-size: 0.85rem; color: var(--ink-2); font-weight: 500; }
  .log-link { font-size: 0.78rem; color: var(--accent); cursor: pointer; background: none; border: none; font-family: var(--sans); padding: 0; }
  .log-link:hover { text-decoration: underline; }

  .card { width: 100%; background: white; border: 1px solid var(--paper-3); border-radius: 16px; padding: 2rem 1.75rem; margin-bottom: 1.25rem; }
  .card-front-content { cursor: pointer; }
  .card-tag { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 1rem; }
  .card-expression { font-family: var(--serif); font-size: clamp(1.5rem, 5vw, 2rem); line-height: 1.25; color: var(--ink); margin-bottom: 1.5rem; }
  .card-hint { font-size: 0.8rem; color: var(--ink-3); }
  .new-badge { display: inline-block; font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: var(--paper-2); color: var(--ink-3); margin-left: 8px; vertical-align: middle; }
  .new-badge.is-new { background: #faeeda; color: var(--warn); }
  .new-badge.is-due { background: #e1f5ee; color: #0f6e56; }

  .card-back-content { display: none; }
  .back-expression { font-family: var(--serif); font-size: 1.2rem; font-style: italic; color: var(--ink); margin-bottom: 1.25rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--paper-2); }
  .back-default { font-size: 0.82rem; color: var(--ink-3); font-style: italic; margin-bottom: 1.25rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--paper-2); }
  .back-default strong { color: var(--ink-2); font-style: normal; font-weight: 500; }
  .back-section { margin-bottom: 1.25rem; }
  .back-label { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.4rem; }
  .back-def { font-size: 0.9rem; color: var(--ink); line-height: 1.7; padding-bottom: 1.25rem; border-bottom: 1px solid var(--paper-2); }
  .colloc-list { font-size: 0.82rem; color: var(--ink-2); line-height: 2; padding-bottom: 1.25rem; border-bottom: 1px solid var(--paper-2); }
  .colloc-item { display: block; }
  .colloc-en { color: var(--ink); font-style: italic; }
  .sample-sentence { font-size: 0.88rem; color: var(--ink-2); line-height: 1.7; font-style: italic; background: var(--paper); border-left: 2px solid var(--accent-2); padding: 0.75rem 1rem; border-radius: 0 8px 8px 0; }

  .rating-wrap { display: none; grid-template-columns: 1fr 1fr 1fr; gap: 10px; width: 100%; max-width: 560px; }
  .rating-wrap.visible { display: grid; }
  .rating-btn { padding: 0.9rem 0.5rem; border: 1px solid var(--paper-3); border-radius: 10px; background: white; font-family: var(--sans); font-size: 0.82rem; font-weight: 500; cursor: pointer; transition: background 0.15s; text-align: center; line-height: 1.3; }
  .rating-btn .btn-label { display: block; font-size: 0.7rem; font-weight: 400; margin-top: 3px; color: var(--ink-3); }
  .btn-again { color: var(--danger); border-color: #f0baba; }
  .btn-again:hover { background: #fcebeb; }
  .btn-hard { color: var(--warn); border-color: #f5d8b0; }
  .btn-hard:hover { background: #faeeda; }
  .btn-good { color: var(--success); border-color: #c0dd97; }
  .btn-good:hover { background: #eaf3de; }

  #done-screen { display: none; text-align: center; width: 100%; max-width: 480px; }
  .done-icon { width: 56px; height: 56px; background: var(--paper-2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; font-size: 1.4rem; }
  .done-title { font-family: var(--serif); font-size: 1.5rem; margin-bottom: 0.5rem; }
  .done-sub { font-size: 0.85rem; color: var(--ink-2); line-height: 1.6; margin-bottom: 1.75rem; }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.75rem; }
  .stat-box { background: white; border: 1px solid var(--paper-3); border-radius: 10px; padding: 1rem 0.5rem; }
  .stat-num { font-family: var(--serif); font-size: 1.5rem; color: var(--ink); }
  .stat-lbl { font-size: 0.7rem; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 4px; }
  .btn-secondary { display: inline-block; padding: 0.65rem 1.25rem; border: 1px solid var(--paper-3); border-radius: 8px; font-family: var(--sans); font-size: 0.85rem; color: var(--ink-2); background: white; cursor: pointer; margin: 4px 5px; transition: background 0.15s; }
  .btn-secondary:hover { background: var(--paper-2); }
  .btn-accent { border-color: var(--accent-2); color: var(--accent); }
  .btn-accent:hover { background: #faeeda; }

  .backlog-note { font-size: 0.8rem; color: var(--ink-3); line-height: 1.6; margin: 1rem 0 0.5rem; }

  /* settings */
  .settings-box { margin-top: 2rem; text-align: left; background: white; border: 1px solid var(--paper-3); border-radius: 10px; padding: 0.25rem 1rem; }
  .settings-box summary { font-size: 0.8rem; color: var(--ink-3); cursor: pointer; padding: 0.65rem 0; list-style: none; }
  .settings-box summary::before { content: '⚙ '; }
  .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-top: 1px solid var(--paper-2); font-size: 0.85rem; color: var(--ink-2); }
  .settings-row input { width: 64px; padding: 0.35rem 0.5rem; border: 1px solid var(--paper-3); border-radius: 6px; font-family: var(--sans); font-size: 0.85rem; text-align: center; background: var(--paper); }
  .settings-save { margin: 0.65rem 0; text-align: right; }

  /* today log screen */
  #log-screen { display: none; width: 100%; max-width: 560px; }
  .log-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1rem; }
  .log-title { font-family: var(--serif); font-size: 1.15rem; }
  .log-list { display: flex; flex-direction: column; gap: 8px; }
  .log-item { background: white; border: 1px solid var(--paper-3); border-radius: 10px; padding: 0.85rem 1.1rem; cursor: pointer; }
  .log-item-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .log-expr { font-family: var(--serif); font-size: 0.98rem; }
  .log-rating { flex-shrink: 0; font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; }
  .lr-good { background: #eaf3de; color: var(--success); }
  .lr-hard { background: #faeeda; color: var(--warn); }
  .lr-again { background: #fcebeb; color: var(--danger); }
  .log-detail { display: none; margin-top: 0.85rem; padding-top: 0.85rem; border-top: 1px solid var(--paper-2); font-size: 0.84rem; color: var(--ink-2); line-height: 1.7; }
  .log-item.open .log-detail { display: block; }
  .log-detail .back-label { margin-top: 0.6rem; }
  .log-empty { text-align: center; font-size: 0.85rem; color: var(--ink-3); padding: 2rem 0; }
</style>
</head>
<body>

<header>
  <div class="site-title">Between the Words</div>
  <div class="site-sub">词汇复习 · Spaced Repetition</div>
</header>

<div id="setup-screen">
  <div class="setup-card">
    <div style="font-size:1.8rem; margin-bottom:0.75rem;">⟳</div>
    <h2 id="loading-title">正在载入词条…</h2>
    <p id="loading-sub">从云端读取最新词汇，请稍候。</p>
  </div>
</div>

<div id="review-screen">
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
  </div>
  <div class="session-meta">
    <span class="session-label" id="queue-type">复习中</span>
    <button class="log-link" onclick="showLog('review')">今日已复习 <span id="log-count-top">0</span></button>
    <span class="session-count" id="queue-count"></span>
  </div>

  <div class="card">
    <div class="card-front-content" id="front-content" onclick="revealCard()">
      <div class="card-tag">Expression <span class="new-badge" id="card-badge"></span></div>
      <div class="card-expression" id="card-expression"></div>
      <div class="card-hint">点击查看释义 →</div>
    </div>
    <div class="card-back-content" id="back-content">
      <div class="back-expression" id="back-expression"></div>
      <div class="back-default" id="back-default"></div>
      <div class="back-section">
        <div class="back-label">释义</div>
        <div class="back-def" id="back-def"></div>
      </div>
      <div class="back-section">
        <div class="back-label">搭配</div>
        <div class="colloc-list" id="back-colloc"></div>
      </div>
      <div class="back-section">
        <div class="back-label">例句</div>
        <div class="sample-sentence" id="back-sample"></div>
      </div>
    </div>
  </div>

  <div class="rating-wrap" id="rating-wrap">
    <button class="rating-btn btn-again" onclick="rate(0)">✗ 忘了<span class="btn-label">重新来过</span></button>
    <button class="rating-btn btn-hard" onclick="rate(3)">△ 模糊<span class="btn-label">再复习一次</span></button>
    <button class="rating-btn btn-good" onclick="rate(5)">✓ 记住了<span class="btn-label">下次更长</span></button>
  </div>
</div>

<div id="done-screen">
  <div class="done-icon">✦</div>
  <div class="done-title" id="done-title">今日复习完成</div>
  <div class="done-sub" id="done-sub"></div>
  <div class="stats-grid">
    <div class="stat-box"><div class="stat-num" id="stat-total">0</div><div class="stat-lbl">今日已复习</div></div>
    <div class="stat-box"><div class="stat-num" id="stat-good">0</div><div class="stat-lbl">记住了</div></div>
    <div class="stat-box"><div class="stat-num" id="stat-again">0</div><div class="stat-lbl">需加强</div></div>
  </div>
  <div>
    <button class="btn-secondary" onclick="showLog('done')">查看今日已复习</button>
    <button class="btn-secondary" id="btn-extra" style="display:none" onclick="extraSession()">再加练一批</button>
  </div>
  <div class="backlog-note" id="backlog-note" style="display:none"></div>
  <button class="btn-secondary btn-accent" id="btn-amnesty" style="display:none" onclick="spreadBacklog()">分摊积压词条</button>

  <details class="settings-box">
    <summary>每日复习设置</summary>
    <div class="settings-row"><span>每日总上限（张）</span><input type="number" id="set-cap" min="5" max="500"></div>
    <div class="settings-row"><span>其中新词上限（张）</span><input type="number" id="set-new" min="0" max="100"></div>
    <div class="settings-row" style="border-top:none; padding-top:0;">
      <span style="font-size:0.75rem; color:var(--ink-3);">改动从下一批开始生效</span>
      <button class="btn-secondary" style="margin:0" onclick="saveSettings()">保存</button>
    </div>
  </details>
  <div style="margin-top:1rem;">
    <button class="btn-secondary" onclick="resetAll()" style="font-size:0.75rem; color:var(--ink-3);">重置全部进度</button>
  </div>
</div>

<div id="log-screen">
  <div class="log-header">
    <div class="log-title">今日已复习 <span id="log-count" style="color:var(--ink-3); font-size:0.85rem;"></span></div>
    <button class="log-link" onclick="closeLog()">← 返回</button>
  </div>
  <div class="log-list" id="log-list"></div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbz2Pd_HJiEbFeJFldvxPjzT0Lt6kqcpC7ne-WNdWj94vAzb501D3uMTRHSw8RXYECwk1w/exec';
const STORAGE_KEY  = 'btw_srs_v2';      // 卡片数据（向后兼容，新增字段）
const DAILY_KEY    = 'btw_daily_v1';    // 当日复习日志与新词配额
const SETTINGS_KEY = 'btw_settings_v1'; // 每日限额设置
const DAY = 86400000;

let allCards = [], sessionQueue = [], currentIdx = 0;
let sessionStats = { total: 0, good: 0, again: 0 };
let settings = { reviewCap: 30, newLimit: 8 };
let daily = null;
let logReturnTo = 'done';

/* ── 设置 ── */
function loadSettings() {
  try { const s = JSON.parse(localStorage.getItem(SETTINGS_KEY)); if (s) settings = { ...settings, ...s }; } catch(e) {}
}
function saveSettings() {
  const cap = parseInt(document.getElementById('set-cap').value, 10);
  const nl  = parseInt(document.getElementById('set-new').value, 10);
  if (cap >= 5) settings.reviewCap = cap;
  if (nl >= 0) settings.newLimit = Math.min(nl, settings.reviewCap);
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  fillSettingsInputs();
}
function fillSettingsInputs() {
  document.getElementById('set-cap').value = settings.reviewCap;
  document.getElementById('set-new').value = settings.newLimit;
}

/* ── 当日日志（跨刷新持久） ── */
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function loadDaily() {
  try {
    const r = JSON.parse(localStorage.getItem(DAILY_KEY));
    if (r && r.date === todayStr()) return r;
  } catch(e) {}
  return { date: todayStr(), newIntroduced: [], reviewed: [] };
}
function saveDaily() { localStorage.setItem(DAILY_KEY, JSON.stringify(daily)); }
function todayUniqueCount() { return new Set(daily.reviewed.map(r => r.expression)).size; }

/* ── SM-2（带间隔抖动，防止集中到期） ── */
function sm2(card, quality) {
  if (quality < 3) { card.reps = 0; card.interval = 1; }
  else {
    if (card.reps === 0) card.interval = 1;
    else if (card.reps === 1) card.interval = 6;
    else card.interval = Math.round(card.interval * card.ef);
    card.reps += 1;
  }
  card.ef = Math.max(1.3, card.ef + 0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
  let iv = card.interval;
  if (iv >= 3) iv = Math.max(1, Math.round(iv * (0.92 + Math.random() * 0.16))); // ±8% 抖动
  card.nextReview = Date.now() + iv * DAY;
  return card;
}

function initCard(v) { return { ...v, reps: 0, ef: 2.5, interval: 1, nextReview: 0, introducedAt: null }; }
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(allCards)); }
function loadLocal() { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : null; }

/* 旧数据迁移：凡复习过的卡视为"已引入" */
function migrate(card) {
  if (card.introducedAt === undefined) {
    card.introducedAt = (card.reps > 0 || card.nextReview > 0) ? Date.now() : null;
  }
  return card;
}

async function loadFromAPI() {
  loadSettings();
  daily = loadDaily();
  try {
    const res = await fetch(API_URL);
    const vocab = await res.json();
    const saved = loadLocal(), savedMap = {};
    if (saved) saved.forEach(c => savedMap[c.expression] = migrate(c));
    allCards = vocab.filter(v => v.expression).map(v =>
      savedMap[v.expression] ? { ...savedMap[v.expression], ...v } : initCard(v)
    );
    saveData();
    buildSession();
  } catch (e) {
    const saved = loadLocal();
    if (saved && saved.length > 0) {
      allCards = saved.map(migrate);
      document.getElementById('loading-title').textContent = '使用本地缓存';
      document.getElementById('loading-sub').textContent = '网络不可用，使用上次保存的词条。';
      setTimeout(buildSession, 600);
    } else {
      document.getElementById('loading-title').textContent = '载入失败';
      document.getElementById('loading-sub').textContent = '请检查网络后刷新页面。';
    }
  }
}

/* 逾期优先级：逾期越久、间隔越短，越容易忘，越先复习 */
function overdueScore(c) {
  const overdueMs = Date.now() - c.nextReview;
  return overdueMs / ((c.interval || 1) * DAY);
}
function dueReviews() {
  const now = Date.now();
  return allCards.filter(c => c.introducedAt && c.nextReview <= now)
                 .sort((a, b) => overdueScore(b) - overdueScore(a));
}
function freshCards() { return allCards.filter(c => !c.introducedAt); }

/* ── 组卷：每日总上限内，新词占固定名额，其余给逾期复习 ── */
function buildSession(extra) {
  daily = loadDaily();
  const doneToday = todayUniqueCount();
  let totalBudget = extra ? settings.reviewCap : Math.max(0, settings.reviewCap - doneToday);
  if (totalBudget === 0 && !extra) { showDone(true); return; }

  const due = dueReviews();
  let picks = [];

  if (extra) {
    picks = due.slice(0, totalBudget); // 加练只清逾期，不上新词
  } else {
    const newBudget = Math.min(
      Math.max(0, settings.newLimit - daily.newIntroduced.length),
      totalBudget
    );
    const news = freshCards().slice(0, newBudget);
    const reviews = due.slice(0, totalBudget - news.length);
    picks = news.concat(reviews);
  }

  if (picks.length === 0) { showDone(true); return; }
  sessionQueue = shuffle(picks);
  currentIdx = 0;
  sessionStats = { total: 0, good: 0, again: 0 };
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('done-screen').style.display = 'none';
  document.getElementById('log-screen').style.display = 'none';
  document.getElementById('review-screen').style.display = 'block';
  showCard();
}
function extraSession() { buildSession(true); }

function showCard() {
  if (currentIdx >= sessionQueue.length) { showDone(false); return; }
  const card = sessionQueue[currentIdx];
  const isNew = !card.introducedAt;

  document.getElementById('card-expression').textContent = card.expression;
  document.getElementById('back-expression').textContent = card.expression;
  document.getElementById('back-default').innerHTML = '<strong>中式默认：</strong>' + (card.defaultReplacement || '—');
  document.getElementById('back-def').textContent = card.definition || '—';
  document.getElementById('back-sample').textContent = card.sampleSentence || '—';

  const badge = document.getElementById('card-badge');
  badge.textContent = isNew ? '新词' : '复习';
  badge.className = 'new-badge ' + (isNew ? 'is-new' : 'is-due');

  const collocEl = document.getElementById('back-colloc');
  collocEl.innerHTML = '';
  if (card.collocations) {
    card.collocations.split(';').forEach(c => {
      c = c.trim(); if (!c) return;
      const parts = c.split('=');
      const span = document.createElement('span');
      span.className = 'colloc-item';
      span.innerHTML = '<span class="colloc-en">' + (parts[0]||'').trim() + '</span>'
        + (parts[1] ? ' = ' + parts[1].trim() : '');
      collocEl.appendChild(span);
    });
  }

  const total = sessionQueue.length;
  document.getElementById('progress-fill').style.width = (currentIdx / total * 100) + '%';
  document.getElementById('queue-count').textContent = (currentIdx + 1) + ' / ' + total;
  document.getElementById('queue-type').textContent = isNew ? '新词' : '复习';
  document.getElementById('log-count-top').textContent = todayUniqueCount();

  document.getElementById('front-content').style.display = 'block';
  document.getElementById('back-content').style.display = 'none';
  document.getElementById('rating-wrap').classList.remove('visible');
}

function revealCard() {
  document.getElementById('front-content').style.display = 'none';
  document.getElementById('back-content').style.display = 'block';
  document.getElementById('rating-wrap').classList.add('visible');
}

function rate(quality) {
  const card = sessionQueue[currentIdx];

  // 首次引入的新词：记录引入时间并消耗当日新词名额
  if (!card.introducedAt) {
    card.introducedAt = Date.now();
    if (!daily.newIntroduced.includes(card.expression)) daily.newIntroduced.push(card.expression);
  }
  sm2(card, quality);

  sessionStats.total++;
  if (quality < 3) sessionStats.again++; else sessionStats.good++;

  // 写入当日日志（同一词多次评分只保留最新一条）
  daily.reviewed = daily.reviewed.filter(r => r.expression !== card.expression);
  daily.reviewed.push({ expression: card.expression, quality: quality, ts: Date.now() });
  saveDaily();

  const idx = allCards.findIndex(c => c.expression === card.expression);
  if (idx > -1) allCards[idx] = card;
  saveData();

  if (quality === 0) sessionQueue.push(idx > -1 ? allCards[idx] : card); // 忘了：本轮内重做
  currentIdx++;
  showCard();
}

function showDone(nothingDue) {
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('review-screen').style.display = 'none';
  document.getElementById('log-screen').style.display = 'none';
  document.getElementById('done-screen').style.display = 'block';

  daily = loadDaily();
  const remainingDue = dueReviews().length;
  const remainingNew = freshCards().length;
  const doneToday = todayUniqueCount();
  const next = allCards.filter(c => c.nextReview > Date.now()).map(c => c.nextReview).sort()[0];

  document.getElementById('done-title').textContent =
    nothingDue && doneToday === 0 ? '今天没有待复习词条' : '今日任务完成';

  let sub = nothingDue && doneToday === 0
    ? '没有到期的词条，继续保持！'
    : '很好，今天的份量到此为止——明天见。';
  if (next && remainingDue === 0) sub += ' 下次复习：' + formatDate(next);
  document.getElementById('done-sub').textContent = sub;

  document.getElementById('stat-total').textContent = doneToday;
  document.getElementById('stat-good').textContent = sessionStats.good;
  document.getElementById('stat-again').textContent = sessionStats.again;

  // 剩余逾期提示 + 加练入口
  const note = document.getElementById('backlog-note');
  const extraBtn = document.getElementById('btn-extra');
  if (remainingDue > 0) {
    note.style.display = 'block';
    note.textContent = '还有 ' + remainingDue + ' 个逾期词条排在后面' +
      (remainingNew > 0 ? '，' + remainingNew + ' 个新词等待放行' : '') +
      '。不必今天清完——按每日节奏走更可持续。';
    extraBtn.style.display = 'inline-block';
    extraBtn.textContent = '再加练一批（' + Math.min(remainingDue, settings.reviewCap) + '）';
  } else {
    note.style.display = 'none';
    extraBtn.style.display = 'none';
  }

  // 积压过大时提供一次性分摊
  const amnestyBtn = document.getElementById('btn-amnesty');
  amnestyBtn.style.display = remainingDue > settings.reviewCap * 2 ? 'inline-block' : 'none';

  fillSettingsInputs();
}

/* ── 积压大赦：把所有逾期词随机摊到未来 14 天 ── */
function spreadBacklog() {
  const overdue = dueReviews();
  if (overdue.length === 0) return;
  if (!confirm('将 ' + overdue.length + ' 个逾期词条随机分摊到未来 14 天，从今天起按每日限额正常复习。确定吗？')) return;
  const now = Date.now();
  overdue.forEach(c => {
    c.nextReview = now + Math.floor(Math.random() * 14) * DAY + Math.floor(Math.random() * 12) * 3600000;
  });
  saveData();
  showDone(false);
}

/* ── 今日已复习列表 ── */
const QUALITY_LABEL = { 0: ['忘了', 'lr-again'], 3: ['模糊', 'lr-hard'], 5: ['记住了', 'lr-good'] };

function showLog(returnTo) {
  logReturnTo = returnTo;
  daily = loadDaily();
  const list = document.getElementById('log-list');
  list.innerHTML = '';
  const entries = [...daily.reviewed].sort((a, b) => b.ts - a.ts);
  document.getElementById('log-count').textContent = entries.length ? '· ' + entries.length + ' 个' : '';

  if (entries.length === 0) {
    list.innerHTML = '<div class="log-empty">今天还没有复习记录。</div>';
  } else {
    entries.forEach(e => {
      const card = allCards.find(c => c.expression === e.expression) || {};
      const [label, cls] = QUALITY_LABEL[e.quality] || ['—', ''];
      const item = document.createElement('div');
      item.className = 'log-item';
      item.innerHTML =
        '<div class="log-item-head">' +
          '<span class="log-expr"></span>' +
          '<span class="log-rating ' + cls + '">' + label + '</span>' +
        '</div>' +
        '<div class="log-detail">' +
          (card.defaultReplacement ? '<div class="back-label">中式默认</div><div></div>' : '') +
          '<div class="back-label">释义</div><div class="ld-def"></div>' +
          (card.sampleSentence ? '<div class="back-label">例句</div><div class="ld-sample" style="font-style:italic;"></div>' : '') +
        '</div>';
      item.querySelector('.log-expr').textContent = e.expression;
      const detail = item.querySelector('.log-detail');
      if (card.defaultReplacement) detail.children[1].textContent = card.defaultReplacement;
      detail.querySelector('.ld-def').textContent = card.definition || '—';
      if (card.sampleSentence) detail.querySelector('.ld-sample').textContent = card.sampleSentence;
      item.addEventListener('click', () => item.classList.toggle('open'));
      list.appendChild(item);
    });
  }

  document.getElementById('review-screen').style.display = 'none';
  document.getElementById('done-screen').style.display = 'none';
  document.getElementById('log-screen').style.display = 'block';
}

function closeLog() {
  document.getElementById('log-screen').style.display = 'none';
  if (logReturnTo === 'review' && currentIdx < sessionQueue.length) {
    document.getElementById('review-screen').style.display = 'block';
  } else {
    showDone(false);
  }
}

function resetAll() {
  if (confirm('确定要清除所有复习进度吗？')) {
    allCards.forEach(c => { c.reps = 0; c.ef = 2.5; c.interval = 1; c.nextReview = 0; c.introducedAt = null; });
    localStorage.removeItem(DAILY_KEY);
    daily = loadDaily();
    saveData(); buildSession();
  }
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function formatDate(ts) {
  const d = new Date(ts);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

loadFromAPI();
